name: Verify SooVers Academy
on:
  push:
    branches: [main, work]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:api
      - run: pnpm build
      - run: pnpm build:demo
      - run: pnpm test:server
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ics:browser
      - run: pnpm test:product
      - run: pnpm test:f5:browser
      - run: pnpm test:browser
        env:
          TEST_LOW_QUALITY: '1'
      - run: docker build -t soovers-academy:1.0.0 .
      - run: node scripts/test-container.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soovers-validation
          path: test-results/
