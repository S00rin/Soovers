services:
  soovers:
    image: soovers-academy:${SOOVERS_VERSION:-1.0.0}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your HTTPS public origin}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
    volumes:
      - academy-data:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  academy-data:
